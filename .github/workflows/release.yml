# Builds every platform from one commit and one version number.
#   - Push a tag v<VERSION> (it must equal the VERSION file): builds, then publishes a GitHub
#     Release with all the files. A version with a "-" in it is marked as a pre-release.
#   - Run it by hand (workflow_dispatch): builds and keeps the files as workflow artifacts only.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LINUX_PACKAGES: >-
    pkg-config libasound2-dev libudev-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
    libxinerama-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
    mesa-vulkan-drivers xvfb

jobs:
  check:
    name: Version, unit tests and software-rendered GPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One version everywhere
        id: version
        run: |
          node scripts/set-version.mjs --check
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the VERSION file (v$version)"
            exit 1
          fi
      - name: Web checks
        run: |
          python3 scripts/web-check.py
          node --test tests/analysis.test.mjs tests/monitor.test.mjs
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Shared assets
        run: |
          node scripts/check-test-audio.mjs
          node scripts/export-app-icons.mjs --check
          node scripts/export-shared.mjs
          node scripts/shader-migrate.mjs
      - name: Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml --release --locked
      # No GPU on the runner: Mesa's software Vulkan (lavapipe) renders the three regression scenes.
      - name: GPU regression tests on software Vulkan
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          cargo test --manifest-path rust/Cargo.toml --release --locked -p spectrum-wgpu --lib -- --ignored --test-threads=1 --skip terrain_order

  android:
    name: Android library and demo app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      # The keystore is decoded outside the checkout: the build refuses one inside the repository.
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPECTRUM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spectrum-release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore secret: the APK will be unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests and release build (signed)
        if: steps.keystore.outputs.signed == 'true'
        env:
          SPECTRUM_RELEASE_STORE_FILE: ${{ runner.temp }}/spectrum-release.p12
          SPECTRUM_RELEASE_STORE_PASSWORD: ${{ secrets.SPECTRUM_RELEASE_STORE_PASSWORD }}
          SPECTRUM_RELEASE_KEY_ALIAS: ${{ secrets.SPECTRUM_RELEASE_KEY_ALIAS }}
          SPECTRUM_RELEASE_KEY_PASSWORD: ${{ secrets.SPECTRUM_RELEASE_KEY_PASSWORD }}
        run: |
          export SPECTRUM_ANDROID_HOME="$ANDROID_HOME"
          bash scripts/android-build.sh :spectrum:testDebugUnitTest :app:testDebugUnitTest :spectrum:lintRelease :app:lintRelease :spectrum:assembleRelease :app:assembleRelease
      - name: Tests and release build (unsigned)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          export SPECTRUM_ANDROID_HOME="$ANDROID_HOME"
          bash scripts/android-build.sh :spectrum:testDebugUnitTest :app:testDebugUnitTest :spectrum:lintRelease :app:lintRelease :spectrum:assembleRelease :app:assembleRelease
      - name: Collect files
        run: |
          mkdir -p dist
          cp android/spectrum/build/outputs/aar/spectrum-release.aar "dist/spectrum-3d-$VERSION.aar"
          if [[ "${{ steps.keystore.outputs.signed }}" == true ]]; then
            apk=android/app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
            cp "$apk" "dist/Spectrum-3D-$VERSION-android.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Spectrum-3D-$VERSION-android-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/spectrum-release.p12"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            id: macos
          - name: Windows x64, experimental
            os: windows-latest
            id: windows
          # 22.04 on purpose: the binary then runs on glibc 2.35 and later.
          - name: Linux x64, experimental
            os: ubuntu-22.04
            id: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Linux libraries
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES

      - name: Package (macOS)
        if: matrix.id == 'macos'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          SPECTRUM_MAC_UNIVERSAL=1 bash scripts/wgpu-app.sh
          app="rust/target/bundle/Spectrum 3D.app"
          lipo -archs "$app/Contents/MacOS/spectrum-wgpu"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/Spectrum-3D-$VERSION-macos-universal.zip"
      - name: Package (Windows)
        if: matrix.id == 'windows'
        run: |
          bash scripts/wgpu-windows-package.sh
          mkdir -p dist
          (cd rust/target/bundle && 7z a -tzip "$GITHUB_WORKSPACE/dist/Spectrum-3D-$VERSION-windows-x64.zip" "Spectrum 3D" > /dev/null)
      - name: Package (Linux)
        if: matrix.id == 'linux'
        run: |
          bash scripts/wgpu-linux-package.sh
          mkdir -p dist
          tar -C rust/target/bundle -czf "dist/Spectrum-3D-$VERSION-linux-x64.tar.gz" spectrum-3d-linux

      # Smoke tests run the packaged program, so they also prove it finds its bundled resources.
      # Linux has a software Vulkan driver and a virtual display, so a failure there is real.
      - name: Smoke test (Linux, window on a virtual display)
        if: matrix.id == 'linux'
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          xvfb-run -a rust/target/bundle/spectrum-3d-linux/bin/spectrum-3d --window --source off --frames 60 --settings "$RUNNER_TEMP/settings.json" > "$RUNNER_TEMP/smoke.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(r.error||r.frames!==60){console.error(r);process.exit(1)} console.log('frames',r.frames,'adapter',r.adapter)" "$RUNNER_TEMP/smoke.json"
      # The macOS and Windows runners may have no usable graphics adapter, so these two only report.
      - name: Smoke test (macOS, off-screen)
        if: matrix.id == 'macos'
        continue-on-error: true
        run: |
          "rust/target/bundle/Spectrum 3D.app/Contents/MacOS/spectrum-wgpu" --headless --frames 30 --output "$RUNNER_TEMP/frame.ppm" | tail -1
          ls -la "$RUNNER_TEMP/frame.ppm"
      - name: Smoke test (Windows, off-screen)
        if: matrix.id == 'windows'
        continue-on-error: true
        run: |
          "rust/target/bundle/Spectrum 3D/Spectrum 3D.exe" --headless --frames 30 --output "$RUNNER_TEMP/frame.ppm" | tail -1
          ls -la "$RUNNER_TEMP/frame.ppm"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    if: github.ref_type == 'tag'
    needs: [check, android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Spectrum 3D $VERSION" --notes-file RELEASE_NOTES.md $prerelease
