[package]
name = "spectrum-wgpu"
version = "0.3.0-beta.1"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spectrum-core = { path = "../spectrum-core" }
wgpu = { version = "27", features = ["webgl"] }
pollster = "0.4"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.17"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "aac", "isomp4", "ogg", "vorbis"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
egui = "0.33"
egui-winit = { version = "0.33", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-wgpu = "0.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance", "console"] }

# 只在 Windows 主机上构建时需要：把 assets/icons/spectrum.ico 嵌进 exe（构建期依赖，不进运行时）。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
